[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memdec"
version = "1.0.0"
description = "Reproducibility toolkit for the Decidability Before Maintenance study on LLM agent memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Han Li", email = "2499371088@qq.com" }]
keywords = ["llm-agents", "memory", "evaluation", "reproducibility", "position-bias"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deliberately no runtime dependencies: the measurement pipeline and the analysis
# use the standard library only, so a reviewer can reproduce the results on a bare
# Python install with no network and no virtualenv.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/tatusi285/memory-decidability"
Issues = "https://github.com/tatusi285/memory-decidability/issues"

[project.scripts]
memdec = "memdec.cli:main"

[tool.setuptools]
packages = ["memdec", "memdec.analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
