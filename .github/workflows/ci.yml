name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (no runtime dependencies are required)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Claims reproduce from the shipped data
        run: python -m memdec verify

      - name: Design audit builds
        run: python -m memdec audit

      - name: Tables and figures regenerate
        run: |
          python -m memdec tables
          python -m memdec figures
          test -s docs/tables/table1_main_grid.md
          test -s docs/figures/figure1_delay_curves.svg

      - name: Committed outputs are up to date
        # A stale table is a bug: docs/ is generated from data/ and committed, so a
        # regeneration that changes a byte means someone edited data/ or the analysis
        # without rebuilding.
        run: git diff --exit-code -- docs/

      - name: Lint
        run: python -m ruff check memdec tests

      - name: Upload generated artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: docs/
          retention-days: 14
